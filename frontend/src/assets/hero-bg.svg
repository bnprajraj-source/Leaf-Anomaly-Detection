<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f2a1a"/>
      <stop offset="50%" stop-color="#0a1f12"/>
      <stop offset="100%" stop-color="#060f08"/>
    </radialGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="30%">
      <stop offset="0%" stop-color="rgba(34,197,94,0.15)"/>
      <stop offset="100%" stop-color="rgba(34,197,94,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="25%">
      <stop offset="0%" stop-color="rgba(74,222,128,0.1)"/>
      <stop offset="100%" stop-color="rgba(74,222,128,0)"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Ambient glows -->
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  
  <!-- Floating leaf silhouettes - blurred background -->
  <g filter="url(#blur2)" opacity="0.15">
    <path d="M200 200 C180 180, 140 190, 130 220 C120 250, 140 280, 170 290 C200 300, 220 280, 230 250 C240 220, 220 200, 200 200Z" 
          fill="#22c55e"/>
    <path d="M1700 300 C1680 280, 1640 290, 1630 320 C1620 350, 1640 380, 1670 390 C1700 400, 1720 380, 1730 350 C1740 320, 1720 300, 1700 300Z" 
          fill="#4ade80"/>
    <path d="M400 800 C380 780, 340 790, 330 820 C320 850, 340 880, 370 890 C400 900, 420 880, 430 850 C440 820, 420 800, 400 800Z" 
          fill="#16a34a"/>
    <path d="M1500 750 C1480 730, 1440 740, 1430 770 C1420 800, 1440 830, 1470 840 C1500 850, 1520 830, 1530 800 C1540 770, 1520 750, 1500 750Z" 
          fill="#22c55e"/>
  </g>
  
  <!-- Particle dots -->
  <g opacity="0.3">
    <circle cx="150" cy="150" r="2" fill="#4ade80"/>
    <circle cx="300" cy="400" r="1.5" fill="#22c55e"/>
    <circle cx="500" cy="200" r="1" fill="#4ade80"/>
    <circle cx="700" cy="600" r="2" fill="#16a34a"/>
    <circle cx="900" cy="300" r="1.5" fill="#4ade80"/>
    <circle cx="1100" cy="500" r="1" fill="#22c55e"/>
    <circle cx="1300" cy="200" r="2" fill="#4ade80"/>
    <circle cx="1500" cy="450" r="1.5" fill="#16a34a"/>
    <circle cx="1700" cy="150" r="1" fill="#22c55e"/>
    <circle cx="200" cy="700" r="1.5" fill="#4ade80"/>
    <circle cx="600" cy="850" r="2" fill="#16a34a"/>
    <circle cx="1000" cy="750" r="1" fill="#4ade80"/>
    <circle cx="1400" cy="900" r="1.5" fill="#22c55e"/>
    <circle cx="1800" cy="650" r="2" fill="#4ade80"/>
    <circle cx="400" cy="500" r="1" fill="#16a34a"/>
    <circle cx="800" cy="100" r="1.5" fill="#4ade80"/>
    <circle cx="1200" cy="800" r="1" fill="#22c55e"/>
    <circle cx="1600" cy="550" r="2" fill="#4ade80"/>
  </g>
  
  <!-- Grid lines (subtle) -->
  <g stroke="rgba(34,197,94,0.03)" stroke-width="1">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
  
  <!-- Scan line effect -->
  <defs>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(74,222,128,0)"/>
      <stop offset="50%" stop-color="rgba(74,222,128,0.3)"/>
      <stop offset="100%" stop-color="rgba(74,222,128,0)"/>
    </linearGradient>
  </defs>
  <rect x="0" y="540" width="1920" height="2" fill="url(#scanGrad)" opacity="0.4"/>
</svg>